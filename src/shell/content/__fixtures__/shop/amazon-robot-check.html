<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Robot Check</title>
</head>
<body>
  <div class="a-container a-padding-double-large">
    <div class="a-box a-alert a-alert-info">
      <h4>Enter the characters you see below</h4>
      <p>Sorry, we just need to make sure you're not a robot. For best results, please make sure your browser is accepting cookies.</p>
    </div>
    <form method="get" action="/errors/validateCaptcha">
      <img src="https://images-na.ssl-images-amazon.com/captcha/sample.jpg" />
      <input type="text" name="field-keywords" placeholder="Type characters" />
      <button type="submit">Continue shopping</button>
    </form>
    <div class="a-section">
      <p>To discuss automated access to Amazon data please contact api-services-support@amazon.com.</p>
    </div>
  </div>
</body>
</html>
