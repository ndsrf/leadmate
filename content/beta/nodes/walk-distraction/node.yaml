id: walk-distraction
mode: stage
prerequisites:
  - poste-practice
simulation:
  encounters:
    - id: loose-start
      aim: keep-slack
      scenario:
        waypoint: { x: 20, y: 0 }
        distractor: { kind: skateboard, speed: 4, activateAfterMeters: 50, startOffset: 12, triggerRadius: 14 }
    - id: skate-far
      aim: stay-calm
      scenario:
        waypoint: { x: 25, y: 0 }
        distractor: { kind: skateboard, speed: 2, activateAfterMeters: 4, startOffset: 25, triggerRadius: 10 }
    - id: skate-poste
      aim: mark-disengagement
      scenario:
        waypoint: { x: 24, y: 0 }
        distractor: { kind: skateboard, speed: 4, activateAfterMeters: 4, startOffset: 12, triggerRadius: 14 }
        markBudget: 3
        endCondition: { kind: time-limit, seconds: 18 }
    - id: turn-look
      aim: check-in
      scenario:
        waypoints:
          - { x: 6, y: 0 }
          - { x: 6, y: -2 }
        waypoint: { x: 14, y: -2 }
        distractor: { kind: skateboard, speed: 4, activateAfterMeters: 50, startOffset: 12, triggerRadius: 14 }
        markBudget: 3
        endCondition: { kind: time-limit, seconds: 15 }
exercises:
  - metric: tension
    key: node.walk.exerciseTension
  - metric: timing
    key: node.walk.exerciseTiming
  - metric: poste
    key: node.walk.exercisePoste
  - metric: attention
    key: node.walk.exerciseAttention
primerCards:
  - kind: real-world
    media:
      type: image
      url: ""
      art: theory-loose-leash-2
  - kind: virtual-dog
