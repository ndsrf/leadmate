name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type-check and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # builds the Stage bundle and writes src/shell/simHtml.generated.ts (git-ignored), which the type-check imports
      - run: npm run sim:embed
      - run: npm run typecheck
      - run: npm test
      - run: npm run content:validate
